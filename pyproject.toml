[project]
name = "lob-mcp"
version = "0.1.0"
description = "A readable MCP protocol implementation for learning and engineering research"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "cryptography>=45,<47",
    "psycopg[binary,pool]>=3.2,<4",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
lob-mcp = "lob_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lob_mcp"]

[dependency-groups]
dev = [
    "fastmcp>=4.0.1",
    "pillow>=12.3.0",
]
