[project]
name = "lob-mcp"
version = "0.1.0"
description = "A readable MCP protocol implementation for learning and engineering research"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.11,<3",
]

[project.scripts]
lob-mcp = "lob_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lob_mcp"]

